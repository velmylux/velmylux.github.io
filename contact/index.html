<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | velmylux</title>
    <!-- Pastikan variabel CSS ini cocok dengan style footer-mu -->
    <style>
        :root { --accent: #332C28; --text-light: #555; }
        body {
            background: linear-gradient(180deg, #E5DDD5 0%, #C2B6AC 100%);
            margin: 0; padding: 40px 20px;
            font-family: 'Montserrat', sans-serif;
            display: flex; justify-content: center; min-height: 100vh; text-align: center;
        }
        .container { width: 100%; max-width: 500px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #fff; margin-bottom: 15px; }
        .name { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; color: #1A1714; }
        .bio { font-size: 16px; color: #1A1714; margin-bottom: 30px; }
        .link-btn {
            display: block; background: #E3D9CE; border: 1px solid #1A1714;
            color: #1A1714; padding: 18px; margin-bottom: 15px;
            border-radius: 30px; text-decoration: none; font-weight: 500; transition: 0.3s;
        }
        .link-btn:hover { background: #1A1714; color: #fff; }
        /* Style tambahan agar footer rapi */
        .footer-logo { width: 50px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="https://velmylux.github.io/logo.png" alt="Profile">
        <h1 class="name">velmylux</h1>
        <p class="bio">Preloved Luxury Enthusiast 👜</p>

        <!-- Tombol Link -->
        <a href="https://wa.me/nomor_kamu" class="link-btn">Chat Admin (WhatsApp)</a>
        <a href="https://t.me/username_kamu" class="link-btn">Telegram Channel</a>
        <a href="../index.html" class="link-btn">Back to Home</a>
        
        <!-- ID ini harus sama dengan yang di footer.js -->
        <div id="global-footer"></div>
        
        <script src="../footer.js"></script>
    </div>
</body>
</html>
