<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://velmylux.github.io/logo.png">
<title>velmylux</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0EAE4;
    --bg-dark: #1A1714;
    --accent: #C9B8AE;
    --accent-mid: #A8948A;
    --text: #1A1714;
    --text-light: #9C8E88;
    --border: #E0D6CF;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(201,184,174,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,184,174,0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 60px 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
    flex: 1;
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 2px;
    flex-shrink: 0;
  }

  .avatar {
    width: 180px;
    height: auto;
    display: block;
    mix-blend-mode: multiply;
    opacity: 0.9;
  }

  .avatar-ring { display: none; }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 6px;
  }

  .bio {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: #5C504A;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 32px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 36px;
    opacity: 0.5;
  }

  .brand-statement {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 300;
    font-style: italic;
    color: #5C504A;
    text-align: center;
    line-height: 1.7;
    letter-spacing: 0.3px;
    margin-bottom: 32px;
    opacity: 0.85;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .link-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
    background: rgba(253,250,248,0.8);
    border: 1px solid var(--border);
    border-radius: 2px;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
    text-align: center;
  }

  .link-btn:nth-child(1) { animation-delay: 0.08s; }
  .link-btn:nth-child(2) { animation-delay: 0.16s; }
  .link-btn:nth-child(3) { animation-delay: 0.24s; }
  .link-btn:nth-child(4) { animation-delay: 0.32s; }
  .link-btn:nth-child(5) { animation-delay: 0.40s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .link-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.25s ease;
    transform-origin: bottom;
  }

  .link-btn:hover {
    background: rgba(253,250,248,1);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(201,184,174,0.2);
  }

  .link-btn:hover::before { transform: scaleY(1); }

  .link-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #1A1714;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .link-sub {
    font-size: 10px;
    font-weight: 400;
    color: #5C504A;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #global-footer {
    width: 100vw;
    background: var(--bg-dark);
    padding: 32px 24px;
    text-align: center;
    margin-top: auto;
    position: relative;
    z-index: 1;
  }

  .footer-logo {
    width: 100px;
    height: 40px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
    opacity: 0.7;
  }

  .footer-tagline {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--text-light);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="container">

  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <img class="avatar" src="https://velmylux.github.io/logo.png" alt="velmylux">
  </div>

  <h1 class="name" style="display:none;">velmylux</h1>
  <p class="bio">Preloved Luxury Enthusiast 👜</p>
  <div class="divider"></div>

  <p class="brand-statement">A curated space for luxury fashion enthusiasts.<br>Discover, connect, and explore.</p>

  <div class="links">

    <a href="https://wa.me/60147380168" class="link-btn" target="_blank">
      <span class="link-title">Let's Chat 😊</span>
      <span class="link-sub">WhatsApp</span>
    </a>

    <a href="https://t.me/namaChannel" class="link-btn" target="_blank">
      <span class="link-title">Curated Finds</span>
      <span class="link-sub">Telegram Channel</span>
    </a>

    <a href="https://t.me/namaAdmin" class="link-btn" target="_blank">
      <span class="link-title">Contact Admin Directly</span>
      <span class="link-sub">Telegram Personal</span>
    </a>

    <a href="https://instagram.com/velmylux" class="link-btn" target="_blank">
      <span class="link-title">Follow Us 📸</span>
      <span class="link-sub">Instagram · @velmylux</span>
    </a>

    <a href="./what-they-say.html" class="link-btn">
      <span class="link-title">What They Say 💬</span>
      <span class="link-sub">Community Reviews</span>
    </a>

  </div>

</div>

<div id="global-footer"></div>
<script src="./footer.js"></script>
</body>
</html>
